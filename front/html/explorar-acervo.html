<!-- ===== EXPLORAR / ACERVO ===== -->
  <section class="section section--dark" id="explorar">
    <div class="container">
      <div class="section__header">
        <p class="section__label">Acervo</p>
        <h2 class="section__title">Partituras em destaque</h2>
        <p class="section__desc">Descubra obras criadas pela comunidade — do barroco ao jazz contemporâneo.</p>
      </div>

      <!-- Filtros -->
      <div class="filtros" id="filtros">
        <button class="filtro filtro--active" data-genre="todos">Todos</button>
        <button class="filtro" data-genre="classico">Clássico</button>
        <button class="filtro" data-genre="jazz">Jazz</button>
        <button class="filtro" data-genre="popular">Popular</button>
        <button class="filtro" data-genre="contemporaneo">Contemporâneo</button>
        <button class="filtro" data-genre="mpb">MPB</button>
      </div>

      <!-- Grid de partituras -->
      <div class="cards-grid" id="cardsGrid">
        <!-- Gerado via JS -->
      </div>

      <div class="section__footer">
        <button class="btn btn--ghost btn--large" id="btnVerMais">Ver mais partituras</button>
      </div>
    </div>
  </section>
